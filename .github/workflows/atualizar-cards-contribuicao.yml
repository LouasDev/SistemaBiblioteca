name: Atualizar cards de contribuição

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/contribuicoes/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calcular e gerar cards
        run: python Ferramentas/gerar_cards_contribuicao.py
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuicoes
          git diff --cached --quiet || (git commit -m "chore: atualizar cards de contribuição" && git push)
